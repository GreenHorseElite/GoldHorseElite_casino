<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Cocktail Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Шапка: Баланс и Ставка -->
        <header class="game-header">
            <div class="info-box">
                <span class="label">БАЛАНС</span>
                <span id="balance-val" class="value">1000</span>
            </div>
            <div class="logo-box">
                <h1>FRUIT COCKTAIL</h1>
            </div>
            <div class="info-box">
                <span class="label">СТАВКА</span>
                <span id="bet-val" class="value">10</span>
            </div>
        </header>

        <!-- Основное поле игры (барабаны + мини-игра) -->
        <main class="game-main">
            <div id="slot-grid" class="slot-grid">
                <!-- Ячейки сгенерируются через JS -->
            </div>
        </main>

        <!-- Панель управления и кнопки -->
        <footer class="game-footer">
            <div class="controls-left">
                <button id="btn-help" class="btn secondary">СПРАВКА</button>
                <button id="btn-lines" class="btn secondary">ЛИНИИ: <span id="lines-val">9</span></button>
            </div>
            <div class="controls-center">
                <button id="btn-bet" class="btn secondary">МИН/МАКС</button>
            </div>
            <div class="controls-right">
                <button id="btn-spin" class="btn primary">ПУСК</button>
            </div>
        </footer>
    </div>

    <!-- Модальное окно справки / таблицы выплат -->
    <div id="help-modal" class="modal hidden">
        <div class="modal-content">
            <h2>ТАБЛИЦА ВЫПЛАТ</h2>
            <div id="paytable-container">
                <!-- Наполнится через JS -->
            </div>
            <button id="btn-close-modal" class="btn primary">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script src="fruit-cocktail.js"></script>
</body>
</html>
